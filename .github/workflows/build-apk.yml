name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "Makefile"
      - ".gitignore"
      - "LICENSE"
      - "LICENSES/**"
  workflow_dispatch:

# a newer push replaces a build that is still running
concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # keep in sync with flet in pyproject.toml and requirements.txt
  FLET_VERSION: "1.0.4"
  FLUTTER_VERSION: "3.44.8"

jobs:
  build:
    # ubuntu-latest is 26.04 now; the build is tested on 24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # the runner has little free space and the APK build needs it
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/share/boost /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null || true
          df -h /

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Install the pinned packages
        run: pip install -r requirements.txt

      - name: Check the pinned Flet version
        run: python -c "import importlib.metadata as m; assert m.version('flet') == '${{ env.FLET_VERSION }}', m.version('flet')"

      - name: Run tests
        run: python run_tests.py

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          java-version: '17'
          distribution: 'temurin'

      # without the secrets the APK is signed with a throwaway debug key
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the release key"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not set: the APK is signed with a debug key and cannot be published"
          fi

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$FLET_ANDROID_SIGNING_KEY_STORE" ]; then
            if [ -z "$KEYSTORE_PASSWORD" ]; then
              echo "::error::ANDROID_KEYSTORE_PASSWORD is not set"
              exit 1
            fi
            export FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD="$KEYSTORE_PASSWORD"
            export FLET_ANDROID_SIGNING_KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            export FLET_ANDROID_SIGNING_KEY_ALIAS="${KEY_ALIAS:-upload}"
            keytool -list -keystore "$FLET_ANDROID_SIGNING_KEY_STORE" \
              -storepass:env FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD \
              -alias "$FLET_ANDROID_SIGNING_KEY_ALIAS" || {
              echo "::error::keystore password or alias do not match the keystore (secrets ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS)"
              exit 1
            }
          fi
          flet build apk --yes --build-number ${{ github.run_number }}

      - name: Disk usage
        if: always()
        run: |
          df -h /
          du -sh build ~/.gradle ~/.pub-cache /usr/local/lib/android/sdk "$RUNNER_TOOL_CACHE" 2>/dev/null || true

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find build -name "*.apk" | head -n 1)
          ls -lh "$APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aitrace-android
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
