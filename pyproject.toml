[project]
name = "aitrace"
version = "0.2.0"
description = "Android app that detects AI-written Russian text and explains the verdict"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    # keep in sync with requirements.txt and FLET_VERSION in the workflow
    "flet==1.0.4",
    # numpy, onnxruntime and tokenizers: the newest versions with Android arm64
    # wheels on pypi.flet.dev; newer ones exist on PyPI but not for Android
    "numpy==2.4.6",
    "onnxruntime==1.27.0",
    "tokenizers==0.23.1",
    "pymorphy3==2.0.6",
    "pymorphy3-dicts-ru==2.4.417150.4580142",
]

[tool.flet]
product = "AITrace"
bundle_id = "com.flet.aitrace"

[tool.flet.android]
target_arch = ["arm64-v8a"]

[tool.flet.app]
exclude = [
    "tests",
    "tools",
    "store",
    "android_errors",
    "dnevnik",
    "Makefile",
    "README.md",
    "run_tests.py",
    "finetune_android.ipynb",
    "LICENSE",
    "LICENSES",
    "THIRD_PARTY_NOTICES.md",
    "requirements.txt",
]
