[project]
name = "aitrace"
version = "0.2.0"
dependencies = [
    "flet==1.0.4",  # keep in sync with FLET_VERSION in the workflow
    "numpy",
    "onnxruntime",
    "tokenizers",
    "pymorphy3==2.0.6",
]

[tool.flet]
product = "AITrace"
bundle_id = "com.flet.aitrace"

[tool.flet.android]
target_arch = ["arm64-v8a"]

[tool.flet.app]
exclude = [
    "tests",
    "tools",
    "store",
    "android_errors",
    "dnevnik",
    "Makefile",
    "README.md",
    "run_tests.py",
    "finetune_android.ipynb",
]
